<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="github_profile_find.css">
</head>
<body>
  <main class="page">

    <h1 class="title">Find a GitHub profile</h1>

    <!-- Search -->
    <form class="search" id="search-form">
      
      <input id="username" value="" type="text" placeholder="Enter a GitHub username" autocomplete="off">
      <button type="submit">Search</button>
    </form>

    <!-- Error / status message (JS will fill this) -->
    <p class="message" id="message" role="status" aria-live="polite" hidden>
      No user found. Check the spelling and try again.
    </p>

    <!-- Profile (JS will fill these in) -->
    <section class="profile" id="profile">
      <div class="profile-top">
        <img class="avatar" id="avatar" src="" alt="Profile picture">
        <div class="profile-info">
          <h2 class="name" id="name"></h2>
          <a class="login" id="login" href="" target="_blank" rel="noopener"></a>
          <p class="bio" id="bio"></p>
        </div>
      </div>

      <dl class="stats">
        <div class="followers">
          <dt>Followers</dt>
          <dd id="followers"></dd>
        </div>
        <div class="following">
          <dt>Following</dt>
          <dd id="following"></dd>
        </div>
        <div class="repo">
          <dt>Repositories</dt>
          <dd id="repo-count"></dd>
        </div>
      </dl>
    </section>

    <!-- Repositories -->
    <section class="repos" aria-labelledby="repos-heading">
      <h3 id="repos-heading"></h3>
      <ul class="repo-list" id="repo-list">
     
      </ul>
    </section>

  </main>

  <script src="github_profile_find.js"></script>
</body>
</html>
